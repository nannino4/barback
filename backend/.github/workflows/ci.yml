name: Backend Publish Dev Images

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy (defaults to commit SHA)
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute deploy tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "deploy_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run backend tests via Docker test stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: test
          push: false
          tags: barback-backend:test-predeploy
          cache-from: type=gha

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/barback-backend:${{ steps.meta.outputs.deploy_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/barback-backend:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

